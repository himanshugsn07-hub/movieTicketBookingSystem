spring.application.name=movieTicketBookingSystem

spring.datasource.url=jdbc:postgresql://localhost:5432/movie_ticket_db
spring.datasource.username=hgusain
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Seeded admin account (override with APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}

# Simulated notification provider latency in ms (0 = none)
app.notification.simulated-delay-ms=0

# A request waits at most this long for a row lock held by another request, then fails with 503 (retry).
app.db.lock-timeout=5s
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '${app.db.lock-timeout}'
