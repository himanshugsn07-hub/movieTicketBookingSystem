# Integration tests run against their own database so the development data is never touched.
# Create it once with: createdb movie_ticket_test
spring.datasource.url=jdbc:postgresql://localhost:5432/movie_ticket_test
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

app.db.lock-timeout=1s

# The tests trigger the expiry and notification sweeps themselves.
app.scheduling.enabled=false
